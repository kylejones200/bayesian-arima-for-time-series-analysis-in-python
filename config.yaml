logging:
  level: INFO

data:
  dataset: north_dakota_production
  transform: log_diff
  test_size: 12
  seed: 42
  production_metric: oil
  production_path: data/north_dakota_oil_monthly.csv

bayesian:
  ar_order: 2
  draws: 1000
  tune: 1000
  chains: 4
  target_accept: 0.9
  cores: 1
  random_seed: 42
  trace_path: outputs/trace.nc

# Used when running with --quick
quick:
  draws: 200
  tune: 200
  chains: 2

classical:
  compare_fixed_ar: true
  seasonal: true
  m: 12
  max_p: 3
  max_q: 3
  max_P: 2
  max_Q: 2
  max_d: 2
  max_D: 1
  maxiter: 50
  suppress_warnings: true
  error_action: ignore

output:
  figures_dir: outputs/figures
  results_path: outputs/results.json
  figure_format: png
  figure_dpi: 120
  show: false
  save_trace: true
