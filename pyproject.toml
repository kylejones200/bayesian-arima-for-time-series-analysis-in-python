[project]
name = "bayesian-arima-ts"
version = "0.3.0"
description = "Bayesian AR time series modeling with PyMC compared to classical ARIMA"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.18",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pmdarima>=2.0",
    "pymc>=5.12",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
bayesian-arima-run = "bayesian_arima_ts.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesian_arima_ts"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: full MCMC sampling (skipped by default)",
]

[tool.ruff]
target-version = "py311"
line-length = 108
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
