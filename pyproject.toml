[project]
name = "bayesian-arima-ts"
version = "0.2.0"
description = "Bayesian AR time series modeling with PyMC compared to classical ARIMA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.18",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pmdarima>=2.0",
    "pymc>=5.12",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bayesian-arima-run = "bayesian_arima_ts.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bayesian_arima_ts"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full MCMC sampling (skipped by default)",
]
